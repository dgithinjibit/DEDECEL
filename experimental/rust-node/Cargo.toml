[package]
name = "bidecel-rust-node"
version = "0.1.0"
edition = "2021"
authors = ["BIDECEL Consortium <tech@bidecel.gov>"]
description = "High-performance Rust Node for Oracle Validation & Consensus in BIDECEL Death Certificate Ledger"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
actix-web = "4.4"
chrono = "0.4"
