# Cargo.toml — the "manifest" for a Rust project.
# It declares the project's name, version, and which libraries ("crates") it uses.
# Think of it like package.json in a Node/JS project.

[package]
name = "bidecel-anchor"
version = "0.1.0"
edition = "2021"

# A NEAR contract is compiled into a .wasm library, not a normal executable.
# "cdylib" = build a C-compatible dynamic library, which is what the wasm target needs.
# "rlib"   = also build a normal Rust library so tests can import this code.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# near-sdk is the official toolkit for writing NEAR smart contracts in Rust.
# It gives us #[near] macros, on-chain storage collections (LookupMap), logging, etc.
near-sdk = "5.5.0"

# zk-encoding — the SHARED, single-source-of-truth crate for snarkjs→NEAR byte encoding.
# The contract's Groth16 verifier and the (host/WASM) re-encoder both use these exact
# functions, so the little-endian / Fq2-ordering layout is defined in exactly one place.
zk-encoding = { path = "../crates/zk-encoding" }

[dev-dependencies]
# Only needed while running `cargo test` on our machine (not shipped on-chain).
# This provides a fake blockchain environment so we can unit-test the contract locally.
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

# NOTE: the wasm release profile now lives in the WORKSPACE ROOT Cargo.toml
# (../Cargo.toml). Cargo only honours [profile.*] in the workspace root, so keeping
# it here would be silently ignored once this crate became a workspace member.
